[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "evalnoise"
version = "0.1.0"
description = "Decide whether a change to a language-model setup is real or inside the noise."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = []
keywords = ["evaluation", "llm", "statistics", "testing", "ci"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Source = "https://github.com/harshnsawant-source/evalnoise"
Issues = "https://github.com/harshnsawant-source/evalnoise/issues"

[project.scripts]
evalnoise = "evalnoise.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/evalnoise"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
